name: Windows build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test Keyboard Stabilizer
        run: ./Build-Stabilizer.ps1 -Test -OutputDirectory ./artifacts
      - name: Build and test Keyboard Check
        run: ./Build.ps1 -Test -OutputDirectory ./artifacts
      - name: Upload portable applications
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keyboard-tools-windows
          path: |
            artifacts/KeyboardStabilizer.exe
            artifacts/KeyboardCheck.exe
          if-no-files-found: error
          retention-days: 14
